# Create from your local Claude CLI credentials (one-time setup):
#
#   kubectl create secret generic claude-credentials \
#     --from-file=.credentials.json=$HOME/.claude/.credentials.json \
#     -n slacker
#
# To refresh after re-authenticating locally:
#   kubectl delete secret claude-credentials -n slacker && \
#   kubectl create secret generic claude-credentials \
#     --from-file=.credentials.json=$HOME/.claude/.credentials.json \
#     -n slacker
